<!doctype html>
<html lang="en" data-accent="clay">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — QR Tiles</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/site.css">
<script>
(function () {
  var d = document.documentElement, a = null;
  try { a = localStorage.getItem("qrt-accent"); } catch (e) {}
  if (a) { d.dataset.accent = a; }
})();
</script>
<style>
  .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
  .nf .mark { margin: 0 auto 24px; }
  .nf h1 { font-size: clamp(28px, 5vw, 40px); letter-spacing: -0.018em; margin-bottom: 10px; }
  .nf p { color: var(--dim); font-size: 17px; margin-bottom: 28px; }
</style>
</head>
<body>
<main class="nf">
  <div>
    <picture class="mark-pic" aria-hidden="true"><source srcset="/assets/app-icon-dark.png" media="(prefers-color-scheme: dark)"><img class="mark" src="/assets/app-icon.png" alt="" width="44" height="44"></picture>
    <h1>Nothing lives here.</h1>
    <p>This drawer is empty — the page you scanned for doesn't exist.</p>
    <a class="cta" href="/">Back to QR Tiles</a>
  </div>
</main>
</body>
</html>
